# Sampling ranges for the "velocity intervention" dataset.
#
# Every scene is a table-top of 4-6 free rigid bodies with a FIXED mass. Exactly one
# body (the *subject*) receives an initial linear velocity along a single heading;
# nothing else is actuated. Some bodies sit inside the subject's corridor and get
# struck (interactive); the rest sit outside and stay untouched (bystanders).
# Spheres roll, boxes slide, and a sphere launched without spin first slides and
# then transitions to rolling, so every clip mixes both regimes.
#
# Each scene is rendered as three branches that share the same visual scene and
# the same static camera:
#   factual         - subject launched with the sampled initial velocity
#   counterfactual  - the SAME scene, subject launched with a NEW initial velocity
#                     (the factual velocity is discarded, the new one is applied at
#                      step 0 as the only impulse)
#   subject_removed - the SAME scene without the subject
#
# All values are half-open ranges [low, high] unless documented otherwise.

scene:
  bounds: [[-6.0, -6.0, -0.5], [6.0, 6.0, 4.0]]
  gravity: [0.0, 0.0, -9.81]
  frame_range: [0, 48]          # 48 frames = 2.0 s at 24 fps
  frame_rate: 24
  step_rate: 240                # 10 physics steps per frame

floor:
  object_id: floor
  half_extents: [15.0, 15.0, 0.1]  # top surface at z = 0; wide so no edge shows
  friction: 0.55
  restitution: 0.05

objects:
  count: [4, 6]                 # dynamic bodies INCLUDING the subject (inclusive)
  mass: 1.0                     # fixed for every dynamic body
  shapes:                       # non-subject shape weights
    sphere: 0.45
    cube: 0.35
    cylinder: 0.20
  size: [0.16, 0.30]            # primary half-extent / radius
  aspect_ratio: [0.7, 1.4]      # z half-extent relative to primary (cube, cylinder)
  min_gap: 0.12                 # minimum free space between any two bodies at t=0
  require_sphere_and_box: true  # guarantees rolling and sliding bodies in every scene

subject:
  object_id: subject
  shapes:
    sphere: 0.6
    cube: 0.4
  size: [0.20, 0.30]
  start_x: [-2.8, -2.2]
  start_y: [-0.5, 0.5]
  speed: [3.5, 6.5]             # |v0| in m/s
  heading: [-0.30, 0.30]        # radians measured from +x in the ground plane
  angular_velocity: [0.0, 0.0]  # launched without spin: slides first, then rolls

interactive:
  count: [1, 3]                 # struck bodies placed inside the corridor
  distance: [1.4, 3.6]          # metres from the subject along its heading
  lateral: [-0.6, 0.6]          # fraction of (r_subject + r_object) off the corridor axis

bystanders:
  # Everything that is not the subject and not interactive. Placed outside the
  # corridor so the factual clip leaves them untouched.
  lateral_clearance: 0.45       # metres beyond corridor half-width
  x: [-2.5, 3.5]
  y: [-2.8, 2.8]

counterfactual:
  speed: [3.5, 6.5]
  heading_delta: [0.15, 1.0]    # |Δheading| in radians, sign sampled
  min_speed_delta: 0.0          # heading change alone is enough to qualify

physics:
  rolling_friction: [0.003, 0.012]
  spinning_friction: [0.003, 0.012]
  linear_damping: 0.0
  angular_damping: 0.0

qc:
  max_attempts: 24              # resamples per instance before giving up
  min_struck: 1                 # factual: subject must hit at least one body
  min_untouched: 1              # factual: at least one body never touched
  require_rolling: true         # some body must roll (|ω| r ≈ |v|)
  require_sliding: true         # some body must slip on the floor
  slip_threshold: 0.15          # m/s contact-point slip that counts as sliding
  roll_tolerance: 0.25          # relative |ω r - v| tolerance that counts as rolling
  min_subject_travel: 0.5       # metres
  linear_velocity_ceiling: 25.0
  angular_velocity_ceiling: 120.0
  require_graph_delta: true     # counterfactual must change the contact graph
  keep_in_bounds: true          # every body stays inside scene.bounds

appearance:
  enabled: true
  schema_version: "1.0"
  geometry:
    shapes:
      cube: 0.35
      sphere: 0.35
      cylinder: 0.15
      capsule: 0.15
    size: [0.16, 0.30]
    aspect_ratio: [0.7, 1.4]
    orientation: upright_yaw
  sources:
    procedural: 1.0
  colors:
    strategies:
      hsv: 0.6
      palette: 0.3
      neutral: 0.1
    hue: [0.0, 1.0]
    saturation: [0.35, 0.95]
    value: [0.30, 0.95]
    palette:
      - [0.85, 0.23, 0.20, 1.0]
      - [0.20, 0.45, 0.85, 1.0]
      - [0.95, 0.78, 0.20, 1.0]
      - [0.25, 0.65, 0.35, 1.0]
      - [0.55, 0.30, 0.75, 1.0]
      - [0.95, 0.50, 0.15, 1.0]
    neutral_value: [0.15, 0.85]
  textures:
    scale: [1.0, 8.0]
    detail: [1.0, 6.0]
    roughness: [0.2, 0.8]
    distortion: [0.0, 0.4]
    rotation: [0.0, 1.0]
    color_count: [1, 3]
  materials:
    families: [metal, rubber, plastic, ceramic, wood, stone]
    weights: [1.0, 1.0, 1.2, 1.0, 1.0, 1.0]
  coupling:
    mode: coupled               # friction / restitution follow the sampled family
    held_out: []
  camera:
    # One pose is drawn per scene and held for the whole clip (all branches).
    radius: [4.5, 6.5]            # widened automatically until every body fits the frame
    elevation: [0.45, 1.0]
    azimuth: [0.0, 6.283185307179586]
    focal_length: [38.0, 55.0]
    sensor_width: 36.0
    clipping_range: [0.1, 200.0]
    motion: fixed
    linear_azimuth_delta: [0.0, 0.0]
    safety_margin: 1.25
    look_at_z: [0.0, 0.3]
    frame_margin: 0.08          # normalized image border every body must stay inside at t=0
    expected_travel: 2.5        # metres of subject path included when framing
  lighting:
    rig: three_point
    key:
      position: [[2.5, -3.0, 4.0], [4.0, -1.5, 6.0]]
      intensity: [90.0, 180.0]
      color_temperature: [4500.0, 6800.0]
      size: [1.0, 2.5]
    fill:
      position: [[-3.5, -2.0, 2.5], [-2.0, -0.5, 4.0]]
      intensity: [30.0, 80.0]
      color_temperature: [5200.0, 7200.0]
      size: [1.5, 3.0]
    rim:
      position: [[-1.0, 3.5, 3.0], [1.5, 5.0, 5.0]]
      intensity: [40.0, 110.0]
      color_temperature: [6000.0, 8000.0]
      size: [0.8, 2.0]
  background:
    kind: color
    color_value: [0.10, 0.40]
    color_saturation: [0.0, 0.15]
    strength: [0.8, 1.4]
    exposure: [-0.3, 0.3]
    rotation: [0.0, 1.0]
  floor_material:
    families: [wood, stone, plastic]
    weights: [1.0, 1.0, 0.6]
